allow_external_paths: true
scan_directories:
  - path: ~/mnt/bandicoot/CFReT_subtyping_data
    group: cfret_subtyping_data
  - path: ~/mnt/Way_McKinsey_Cardiac_Fibrosis
    group: way_mckinsey_cardiac_fibrosis

# Optional fallback OMERO group for scan roots that do not define a per-root
# group. Users are not automatically joined to this group unless their users.yml
# entry sets join_shared_group: true.
shared_group: lab
# Default OMERO owner used for imports. Keeping one import owner makes OMERO.web
# show imported projects under one user in "All Users"; per-root groups still
# control which users can see each root.
import_user: habomero
# Optional permission profile applied to shared_group by sync-users.
# Typical value for collaboration visibility: read-annotate
shared_group_permissions: read-annotate
# Optional permission profile applied to each per-root scan directory group.
scan_group_permissions: read-annotate

# Optional root folder name in OMERO for mirrored filesystem hierarchy.
omero_folder_root: scan-root

# Import behavior:
# - copy: duplicate image data into OMERO managed storage
# - inplace: keep data at source path and import by reference (no duplication)
import_mode: inplace

# When true, imported OMERO Images are deleted if their source files are no
# longer found during a successful scan of the configured source root. Source
# files are never deleted by this cleanup.
delete_omero_missing_files: true
# When true, files tracked by the old unscoped imported_files.txt format are
# rechecked/reimported under the current owner/group config so placement config
# changes can repopulate the configured OMERO location.
reimport_legacy_import_state: true
# When true, after a root imports cleanly, same-named scan-root Projects from
# older owner/group placements are deleted while the currently configured
# Project is kept.
cleanup_obsolete_duplicate_projects: true

# Safety controls for high-latency/remote sources:
# Maximum number of files to attempt in a single import-scan run.
# Set to 0 for no cap.
max_files_per_run: 0
# Require DB to report healthy N consecutive checks before imports begin.
db_stable_checks_required: 2
db_stable_check_interval_seconds: 1
# Stop a run after this many per-file failures.
max_failures_per_run: 25
# Pause between individual file imports inside a run.
sleep_between_imports_seconds: 0

# Remote-safe round runner (`uv run poe import-remote-safe`)
safe_import_rounds: 30
# Keep rounds responsive during active ingest while avoiding busy-loop churn.
safe_import_pause_seconds: 2
safe_import_stagnant_rounds: 3

# Optional continuous periodic rescans (safe-import loop)
# When true, import_remote_safe keeps cycling indefinitely.
safe_import_continuous: false
# Pause between completed safe-import cycles in continuous mode.
# Lower than 300s to catch new files sooner without thrashing.
safe_import_cycle_pause_seconds: 10
