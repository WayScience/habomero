---
services:
  db:
    image: postgres:16
    container_name: omero-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  omero-server:
    image: openmicroscopy/omero-server:${OMERO_SERVER_TAG}
    container_name: omero-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ROOTPASS: ${OMERO_ROOT_PASSWORD}
      CONFIG_omero_db_host: db
      CONFIG_omero_db_user: ${POSTGRES_USER}
      CONFIG_omero_db_pass: ${POSTGRES_PASSWORD}
      CONFIG_omero_db_name: ${POSTGRES_DB}
      CONFIG_omero_db_port: "5432"
      # Session timeout controls (milliseconds)
      CONFIG_omero_sessions_timeout:
        "${OMERO_SESSIONS_TIMEOUT_MS:-3600000}"
      CONFIG_omero_sessions_max_user_time_to_idle:
        "${OMERO_SESSIONS_MAX_IDLE_MS:-86400000}"
      CONFIG_omero_sessions_max_user_time_to_live:
        "${OMERO_SESSIONS_MAX_TTL_MS:-0}"
    ports:
      - "4063:4063"
      - "4064:4064"
    volumes:
      - ./data/omero:/OMERO

  omero-web:
    image: openmicroscopy/omero-web-standalone:${OMERO_WEB_TAG}
    container_name: omero-web
    restart: unless-stopped
    depends_on:
      - omero-server
    environment:
      OMEROHOST: omero-server
      CONFIG_omero_web_debug: "false"
      # Keep web sessions after browser close unless explicitly disabled.
      CONFIG_omero_web_session_expire_at_browser_close:
        "${OMERO_WEB_SESSION_EXPIRE_AT_BROWSER_CLOSE:-false}"
    ports:
      - "${OMERO_WEB_PORT}:4080"
    volumes:
      - ./data/omero-web-var:/opt/omero/web/OMERO.web/var
