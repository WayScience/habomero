---
- name: Prepare local OMERO runtime directories
  hosts: local
  gather_facts: true

  pre_tasks:
    - name: Load scan directory config
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../config/omero/scan_dirs.yml"

  roles:
    - role: filesystem
    - role: docker
      when: omero_use_docker_role | bool
