[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=64" ]

[project]
name = "habomero"
version = "0.0.1"
description = "Reproducible server-style OMERO deployment for local development using Docker Compose, Ansible, and uv."
readme = "README.md"
authors = [ { name = "Dave Bunten" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [ "pyyaml>=6.0.2" ]

[dependency-groups]
dev = [
  "poethepoet>=0.34",
  "pre-commit>=4.2",
  "pytest>=8.3.5",
]
docs = [
  "myst-nb>=1.2",
  "pydata-sphinx-theme>=0.16.1",
  "sphinx>=8.2.3",
]

[tool.setuptools]
py-modules = [  ]

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
lint.select = [
  "A",
  "ANN",
  "C4",
  "C90",
  "E",
  "F",
  "I",
  "PL",
  "RUF",
  "SIM",
  "W",
]
lint.per-file-ignores."__init__.py" = [ "F401" ]

[tool.uv]
default-groups = [ "dev" ]

[tool.poe.tasks]
run.sequence = [
  "scan-dirs",
  "provision",
  "up",
  "sync-users",
  "import-scan",
  "healthcheck",
]
remote-run.sequence = [
  "scan-dirs",
  "up",
  "sync-users",
  "healthcheck",
  "import-remote-safe",
  "show-url",
]
remote-run-100.sequence = [
  "scan-dirs",
  "up",
  "sync-users",
  "healthcheck",
  "import-remote-safe-100-parallel",
  "show-url",
]
remote-run-100-parallel.sequence = [
  "scan-dirs",
  "up",
  "sync-users",
  "healthcheck",
  "import-remote-safe-100-parallel",
  "show-url",
]
remote-run-parallel-full.sequence = [
  "scan-dirs",
  "up",
  "sync-users",
  "healthcheck",
  "import-remote-safe-continuous-parallel-full",
  "show-url",
]
reset-state.sequence = [
  "down",
  "wipe-state",
]
reset-and-up.sequence = [
  "reset-state",
  "scan-dirs",
  "up",
  "sync-users",
  "healthcheck",
  "show-url",
]
provision.shell = """
python scripts/project_guard.py
ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
"""
up.shell = """
python scripts/project_guard.py
python scripts/scan_dirs.py
docker compose -f compose.yml -f data/state/scan_roots.compose.yml up -d
python scripts/show_access_url.py
"""
down.shell = """
python scripts/project_guard.py
if [ -f data/state/scan_roots.compose.yml ]; then
  docker compose -f compose.yml -f data/state/scan_roots.compose.yml down
else
  docker compose -f compose.yml down
fi
"""
wipe-state.shell = """
python scripts/project_guard.py
rm -rf data/postgres data/omero data/omero-web-var data/state
mkdir -p data/postgres data/omero data/omero-web-var data/state
"""
logs.shell = """
python scripts/project_guard.py
if [ -f data/state/scan_roots.compose.yml ]; then
  docker compose -f compose.yml -f data/state/scan_roots.compose.yml logs -f --tail=150
else
  docker compose -f compose.yml logs -f --tail=150
fi
"""
backup.shell = """
python scripts/project_guard.py
python scripts/backup.py
"""
restore.shell = """
python scripts/project_guard.py
python scripts/restore.py ${BACKUP_FILE}
"""
healthcheck.shell = """
python scripts/project_guard.py
python scripts/healthcheck.py
"""
sync-users.shell = """
python scripts/project_guard.py
python scripts/sync_users.py
"""
import-scan.shell = """
python scripts/project_guard.py
python scripts/import_scan.py
"""
import-scan-100.shell = """
python scripts/project_guard.py
IMPORT_MAX_FILES_PER_RUN=100 IMPORT_SLEEP_BETWEEN_IMPORTS_SECONDS=0 IMPORT_SCAN_PROGRESS_EVERY_PATHS=50000 IMPORT_PROGRESS_EVERY_FILES=50 python scripts/import_scan.py
"""
import-scan-100-parallel.shell = """
python scripts/project_guard.py
IMPORT_MAX_FILES_PER_RUN=100 IMPORT_SLEEP_BETWEEN_IMPORTS_SECONDS=0 IMPORT_SCAN_PROGRESS_EVERY_PATHS=50000 IMPORT_PROGRESS_EVERY_FILES=50 IMPORT_WORKERS=${IMPORT_WORKERS:-2} python scripts/import_scan.py
"""
import-remote-safe.shell = """
python scripts/project_guard.py
python scripts/show_access_url.py
python scripts/import_remote_safe.py
python scripts/show_access_url.py
"""
import-remote-safe-parallel-full.shell = """
python scripts/project_guard.py
python scripts/show_access_url.py
SAFE_IMPORT_SLEEP_BETWEEN_IMPORTS_SECONDS=0 SAFE_IMPORT_SCAN_PROGRESS_EVERY_PATHS=50000 SAFE_IMPORT_PROGRESS_EVERY_FILES=50 SAFE_IMPORT_WORKERS=${IMPORT_WORKERS:-2} python scripts/import_remote_safe.py
python scripts/show_access_url.py
"""
import-remote-safe-continuous-parallel-full.shell = """
python scripts/project_guard.py
python scripts/show_access_url.py
SAFE_IMPORT_CONTINUOUS=1 SAFE_IMPORT_SLEEP_BETWEEN_IMPORTS_SECONDS=0 SAFE_IMPORT_SCAN_PROGRESS_EVERY_PATHS=50000 SAFE_IMPORT_PROGRESS_EVERY_FILES=50 SAFE_IMPORT_WORKERS=${IMPORT_WORKERS:-2} python scripts/import_remote_safe.py
python scripts/show_access_url.py
"""
import-remote-safe-100-parallel.shell = """
python scripts/project_guard.py
python scripts/show_access_url.py
SAFE_IMPORT_MAX_FILES_PER_RUN=100 SAFE_IMPORT_SLEEP_BETWEEN_IMPORTS_SECONDS=0 SAFE_IMPORT_SCAN_PROGRESS_EVERY_PATHS=50000 SAFE_IMPORT_PROGRESS_EVERY_FILES=50 SAFE_IMPORT_WORKERS=${IMPORT_WORKERS:-2} python scripts/import_remote_safe.py
python scripts/show_access_url.py
"""
import-remote-safe-continuous-100-parallel.shell = """
python scripts/project_guard.py
python scripts/show_access_url.py
SAFE_IMPORT_CONTINUOUS=1 SAFE_IMPORT_MAX_FILES_PER_RUN=100 SAFE_IMPORT_SLEEP_BETWEEN_IMPORTS_SECONDS=0 SAFE_IMPORT_SCAN_PROGRESS_EVERY_PATHS=50000 SAFE_IMPORT_PROGRESS_EVERY_FILES=50 SAFE_IMPORT_WORKERS=${IMPORT_WORKERS:-2} python scripts/import_remote_safe.py
python scripts/show_access_url.py
"""
show-url.shell = """
python scripts/project_guard.py
python scripts/show_access_url.py
"""
scan-dirs.shell = """
python scripts/project_guard.py
python scripts/scan_dirs.py
"""
validate.shell = """
python scripts/project_guard.py
python scripts/validate.py
python scripts/scan_dirs.py
ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check
"""

[tool.vulture]
min_confidence = 90
paths = [ "scripts" ]
